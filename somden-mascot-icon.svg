<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Somden jelly mascot">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="120"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- soft cream background -->
    <rect x="0" y="0" width="512" height="512" fill="#FBF3E6"/>
    <!-- subtle ground arc -->
    <ellipse cx="256" cy="560" rx="360" ry="200" fill="#EDE4CF"/>

    <!-- shadow -->
    <ellipse cx="256" cy="430" rx="120" ry="26" fill="#000000" opacity="0.08"/>

    <!-- feet -->
    <ellipse cx="214" cy="416" rx="30" ry="20" fill="#5E7D52"/>
    <ellipse cx="298" cy="416" rx="30" ry="20" fill="#5E7D52"/>

    <!-- jelly body: soft teardrop -->
    <path d="M256 110
             C372 110 402 232 392 306
             C384 372 336 410 256 410
             C176 410 128 372 120 306
             C110 232 140 110 256 110 Z"
          fill="#7B9E6E"/>

    <!-- cheeks -->
    <ellipse cx="188" cy="300" rx="24" ry="15" fill="#F0A0A0" opacity="0.55"/>
    <ellipse cx="324" cy="300" rx="24" ry="15" fill="#F0A0A0" opacity="0.55"/>

    <!-- eyes -->
    <ellipse cx="212" cy="258" rx="23" ry="27" fill="#2E3A28"/>
    <ellipse cx="300" cy="258" rx="23" ry="27" fill="#2E3A28"/>
    <circle cx="221" cy="248" r="8" fill="#FFFFFF"/>
    <circle cx="309" cy="248" r="8" fill="#FFFFFF"/>

    <!-- smile -->
    <path d="M234 312 Q256 330 278 312" stroke="#2E3A28" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- tiny sprout on top -->
    <path d="M256 110 C256 84 256 70 256 62" stroke="#5E7D52" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M256 78 C240 72 230 58 234 44 C250 46 262 60 256 78 Z" fill="#9DBE7E"/>
    <path d="M256 88 C272 82 284 68 280 54 C264 56 252 70 256 88 Z" fill="#8CB06E"/>
  </g>
</svg>
